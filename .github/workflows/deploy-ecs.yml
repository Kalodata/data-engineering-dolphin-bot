# CI/CD: main → ECR + register task definition (image=:sha) + ECS update-service（OIDC）
# Role: arn:aws:iam::136376784788:role/dolphin-bot-cicd
# 仅 force-new-deployment 可能继续跑旧 digest；必须 register 新 TD 指向本次 GITHUB_SHA。
name: deploy-ecs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: "136376784788"
      ECS_CLUSTER: dolphin-bot
      ECS_SERVICE: dolphin-bot
      ECR: 136376784788.dkr.ecr.ap-southeast-1.amazonaws.com/dolphin-bot
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136376784788:role/dolphin-bot-cicd
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          set -euo pipefail
          docker build -t "$ECR:${GITHUB_SHA}" -t "$ECR:latest" .
          docker push "$ECR:${GITHUB_SHA}"
          docker push "$ECR:latest"

      - name: Register task definition + deploy
        run: |
          set -euo pipefail
          IMAGE="$ECR:${GITHUB_SHA}"
          TD_SRC=deploy/ecs/task-definition.json
          TD_OUT="$(mktemp)"
          cp "$TD_SRC" "$TD_OUT"
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const img = process.argv[2];
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.containerDefinitions[0].image = img;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$TD_OUT" "$IMAGE"
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${TD_OUT}" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "registered: $ARN"
          echo "image: $IMAGE"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ARN" \
            --desired-count 1 \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.{status:status,desired:desiredCount,running:runningCount,taskDef:taskDefinition}' \
            --output table
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            || echo "::warning::wait services-stable timed out or failed; check ECS console"
          rm -f "$TD_OUT"
