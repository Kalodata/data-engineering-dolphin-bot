# CI/CD: main → ECR + ECS update-service（OIDC，无 AK/SK）
# Role: arn:aws:iam::136376784788:role/dolphin-bot-cicd
# 首次：push 出镜像后，由运维建 Task Definition + Service；之后本 workflow 只 force-new-deployment。
# OIDC 信任目前仅 main（非 main 会 AssumeRoleWithWebIdentity 拒绝）。
name: deploy-ecs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: "136376784788"
      ECS_CLUSTER: dolphin-bot
      ECS_SERVICE: dolphin-bot
      ECR: 136376784788.dkr.ecr.ap-southeast-1.amazonaws.com/dolphin-bot
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136376784788:role/dolphin-bot-cicd
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          set -euo pipefail
          docker build -t "$ECR:${GITHUB_SHA}" -t "$ECR:latest" .
          docker push "$ECR:${GITHUB_SHA}"
          docker push "$ECR:latest"

      - name: Deploy (force new deployment)
        run: |
          set -euo pipefail
          # Service 未创建时会失败——预期：先有镜像，运维建好 Service 后再跑或 re-run。
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            || echo "::warning::wait services-stable timed out or failed; check ECS console"
